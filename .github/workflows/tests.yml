name: Unit tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original BLUE agent, multi-target sensor, melee-wave tactics and predictive swarm defense
        run: |
          node --test rrt_arena_v05_core.test.cjs rrt_arena_memory_v061.test.cjs rrt_arena_guided_v061.test.cjs rrt_arena_tactics_v062.test.cjs rrt_arena_defense_v063.test.cjs rrt_arena_multi_v064.test.cjs rrt_arena_melee_v065.test.cjs rrt_arena_swarm_v066.test.cjs rrt_arena_inline_sync.test.cjs rrt_arena_ranged_v067.test.cjs rrt_arena_ranged_runtime_v067.test.cjs
      - name: Verify common BLUE engine and both modes in static entrypoint
        run: |
          test -s index.html
          grep -q 'RRT ARENA 06.7' index.html
          grep -q 'RRTArenaMulti' index.html
          grep -q 'RRTArenaMelee' index.html
          grep -q 'RRTArenaSwarm' index.html
          grep -q 'RRTArenaRanged' index.html
          grep -q 'id="multiEnemyMode"' index.html
          grep -q 'RRTArenaDefense' index.html
          grep -q 'RRTArenaGuided' index.html
          grep -q 'Memory-Guided RRT' index.html

  browser:
    name: Chromium gameplay regression (320 / 393 / 1365)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Run duel, tracking, melee, ranged, and mixed browser tests
        run: node tools/browser_regression.cjs
