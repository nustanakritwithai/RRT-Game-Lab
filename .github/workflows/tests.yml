name: Unit tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original BLUE agent, multi-target sensor, melee-wave tactics and predictive swarm defense
        run: |
          node --test rrt_arena_v05_core.test.cjs rrt_arena_memory_v061.test.cjs rrt_arena_guided_v061.test.cjs rrt_arena_tactics_v062.test.cjs rrt_arena_defense_v063.test.cjs rrt_arena_multi_v064.test.cjs rrt_arena_melee_v065.test.cjs rrt_arena_swarm_v066.test.cjs rrt_arena_inline_sync.test.cjs rrt_arena_ranged_v067.test.cjs rrt_arena_ranged_runtime_v067.test.cjs rrt_arena_rangeddef_v068.test.cjs rrt_arena_team_v069.test.cjs rrt_arena_unified_v0610.test.cjs rrt_arena_coop_v0611.test.cjs rrt_arena_private_radio_v0612.test.cjs rrt_arena_private_runtime_v0612.test.cjs rrt_arena_leaderless_v0613.test.cjs rrt_arena_evidence_v0614.test.cjs rrt_arena_duel_v0615.test.cjs rrt_arena_duel_runtime_v0615.test.cjs rrt_arena_combat_quality_v0616.test.cjs rrt_arena_decision_v0617.test.cjs rrt_arena_peermesh_v07.test.cjs rrt_arena_formation_v0618.test.cjs
      - name: Run PeerMesh deterministic simulation tests (1–1000 agents)
        run: node --test network_lab_core.test.cjs
      - name: Validate PeerMesh browser UI and smoke-test syntax
        run: |
          node --check network_lab_core.js
          node --check network_lab_ui.js
          node --check tools/network_lab_browser.cjs
          node --check tools/peermesh_duel2_browser.cjs
          test -s network-lab.html
      - name: Verify benchmark script syntax
        run: node --check tools/benchmark_swarm.cjs
      - name: Verify Duel2 quality benchmark syntax
        run: |
          node --check tools/benchmark_duel2_quality.cjs
          node --check rrt_arena_formation_v0618.js
          node --check tools/formation_browser.cjs
          node --check tools/benchmark_formation_fullmatch.cjs
      - name: Verify common BLUE engine and both modes in static entrypoint
        run: |
          test -s index.html
          grep -q 'RRT ARENA 06.17' index.html
          grep -q 'RRTArenaRangedDefense' index.html
          grep -q 'RRTArenaTeam' index.html
          grep -q 'RRTArenaCoop' index.html
          grep -q 'RRTArenaPrivateRadio' index.html
          grep -q 'RRTArenaLeaderless' index.html
          grep -q 'RRTArenaEvidence' index.html
          grep -q 'RRTArenaDuel2' index.html
          grep -q 'RRTArenaPeerMesh' index.html
          grep -q 'RRTArenaFormation' index.html
          grep -q 'id="duel2Formation"' index.html
          grep -q 'value="adaptive"' index.html
          grep -q 'id="duel2MeshStatus"' index.html
          grep -q 'id="duel2TeamMode"' index.html
          grep -q 'id="duel2Status"' index.html
          grep -q 'id="blueEvidenceStatus"' index.html
          grep -q 'id="blueTeamMode"' index.html
          grep -q 'RRTArenaMulti' index.html
          grep -q 'RRTArenaMelee' index.html
          grep -q 'RRTArenaSwarm' index.html
          grep -q 'RRTArenaRanged' index.html
          grep -q 'id="multiEnemyMode"' index.html
          grep -q 'RRTArenaDefense' index.html
          grep -q 'RRTArenaGuided' index.html
          grep -q 'Memory-Guided RRT' index.html

  browser:
    name: Chromium gameplay regression (320 / 393 / 1365)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Run duel, tracking, melee, ranged, and mixed browser tests
        run: |
          node tools/browser_regression.cjs
          node tools/network_lab_browser.cjs
          node tools/peermesh_duel2_browser.cjs
          node tools/formation_browser.cjs
          node tools/benchmark_duel2_quality.cjs
      - name: Upload PeerMesh real Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peermesh-chromium-screenshots
          path: artifacts/peermesh-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Duel2 paired-quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duel2-v0617-quality-report
          path: benchmarks/duel2-v0617.json
          if-no-files-found: warn
          retention-days: 30

  team-benchmark:
    name: Team exploratory 12 ranged bots (${{ matrix.team }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        team: [independent, cooperative]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Simulate 20 seeded team matches
        run: |
          mkdir -p benchmarks/team-v0611
          node tools/benchmark_swarm.cjs --seeds 1001-1020 --count 12 --difficulty balanced --enemy ranged --team "${{ matrix.team }}" --width 393 --height 852 --jobs 3 --out "benchmarks/team-v0611/${{ matrix.team }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-v0611-${{ matrix.team }}
          path: benchmarks/team-v0611/${{ matrix.team }}.json
          retention-days: 30

formation-fullmatch:
    name: Hierarchical Buddy / Group full-match research (150s)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Complete seed-paired 150 second matches
        run: |
          node tools/benchmark_formation_fullmatch.cjs --seeds=83,311 --formations=buddy2,group23 --modes=independent,adaptive --out=benchmarks/formation-fullmatch-v08.json
      - name: Upload full-match simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formation-v08-fullmatch-pilot
          path: benchmarks/formation-fullmatch-v08.json
          if-no-files-found: warn
          retention-days: 30

