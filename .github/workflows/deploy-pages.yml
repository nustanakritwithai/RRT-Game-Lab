name: Deploy RRT Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate entry point
        run: |
          test -s index.html
          grep -q 'RRT ARENA 06.8' index.html
          grep -q 'RRTArenaRangedDefense' index.html
          grep -q 'RRTArenaSwarm' index.html
          grep -q 'RRTArenaRanged' index.html
          grep -q 'id="multiEnemyMode"' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage static game
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
