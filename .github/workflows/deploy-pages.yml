name: Deploy RRT Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate entry point
        run: |
          test -s index.html
          test -s network-lab.html
          test -s campaign.html
          grep -q 'RRTArenaCampaignUI' campaign.html
          grep -q 'campaignBattleBridge' index.html
          grep -q 'ruinsFair' index.html
          test -s network_lab_core.js
          test -s network_lab_ui.js
          grep -q 'src="network_lab_core.js"' network-lab.html
          grep -q 'src="network_lab_ui.js"' network-lab.html
          grep -q 'RRT ARENA 09.00' index.html
          grep -q 'RRTArenaObjectives' index.html
          grep -q 'id="duel2Objective"' index.html
          grep -q 'RRTArenaRangedDefense' index.html
          grep -q 'RRTArenaTeam' index.html
          grep -q 'RRTArenaCoop' index.html
          grep -q 'RRTArenaPrivateRadio' index.html
          grep -q 'RRTArenaLeaderless' index.html
          grep -q 'RRTArenaEvidence' index.html
          grep -q 'RRTArenaDuel2' index.html
          grep -q 'RRTArenaPeerMesh' index.html
          grep -q 'RRTArenaFormation' index.html
          grep -q 'id="duel2Formation"' index.html
          grep -q 'value="adaptive"' index.html
          grep -q 'id="duel2MeshStatus"' index.html
          grep -q 'id="duel2TeamMode"' index.html
          grep -q 'id="duel2Status"' index.html
          grep -q 'id="blueEvidenceStatus"' index.html
          grep -q 'id="teamRadioLoss"' index.html
          grep -q 'id="blueTeamMode"' index.html
          grep -q 'RRTArenaSwarm' index.html
          grep -q 'RRTArenaRanged' index.html
          grep -q 'id="multiEnemyMode"' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage static game
        run: |
          mkdir -p dist
          cp index.html campaign.html network-lab.html network_lab_core.js network_lab_ui.js dist/
          touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
